<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawer Maker Pro</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; }
  body { margin: 0; min-width: 360px; min-height: 100vh; font: 12px "Segoe UI", -apple-system, Arial, sans-serif; color: #202b3c; background: #f1f4f8; }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  .app { display: flex; min-height: 100vh; }
  .rail { flex: 0 0 42px; background: #17263c; display: flex; flex-direction: column; align-items: center; padding: 13px 0; gap: 12px; }
  .brand { width: 28px; height: 28px; border-radius: 9px; background: #2c75d8; color: white; display: grid; place-items: center; box-shadow: 0 3px 8px #0d1b2c66; }
  .rail-mark { width: 20px; height: 1px; background: #526176; margin: 1px 0; }
  .rail-label { writing-mode: vertical-rl; transform: rotate(180deg); color: #9eacc0; font-size: 9px; letter-spacing: .16em; font-weight: 700; margin-top: auto; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; max-height: 100vh; }
  .topbar { min-height: 53px; padding: 9px 13px; display: flex; align-items: center; gap: 8px; background: #fff; border-bottom: 1px solid #e2e8f0; }
  .title-wrap { min-width: 0; }
  .eyebrow { color: #75849a; font-size: 9px; letter-spacing: .13em; font-weight: 700; text-transform: uppercase; }
  .title { margin-top: 2px; color: #18283e; font-size: 14px; line-height: 17px; font-weight: 700; }
  .mode-pill { border: 1px solid #d9e6f8; color: #2864a9; background: #f0f6ff; border-radius: 20px; padding: 4px 8px; font-size: 10px; white-space: nowrap; }
  .space-pill { margin-left: auto; color: #53657b; background: #f3f6fa; border: 1px solid #e6ebf1; border-radius: 7px; padding: 5px 7px; font-size: 10px; white-space: nowrap; }
  .content { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 11px 14px; }
  .intro { padding: 2px 1px 1px; color: #67778c; font-size: 11px; line-height: 1.45; }
  .card { overflow: hidden; margin: 9px 0; border: 1px solid #e1e7ef; border-radius: 10px; background: #fff; box-shadow: 0 2px 7px #1d35570a; }
  .card-head { width: 100%; padding: 9px 11px; border: 0; background: #fff; color: #22334b; display: flex; align-items: center; text-align: left; gap: 7px; font-weight: 700; }
  .card-head:hover { background: #fafbfd; }
  .chevron { width: 16px; color: #8290a3; text-align: center; }
  .card.closed .chevron { transform: rotate(-90deg); }
  .card.closed .card-body { display: none; }
  .card-title { flex: 1; }
  .card-hint { color: #8190a3; font-size: 10px; font-weight: 400; }
  .card-body { padding: 9px 11px 11px; border-top: 1px solid #edf0f4; }
  .preview-tools { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 7px; }
  .preview-title { color: #718096; font-size: 10px; }
  .toggle { padding: 2px; border: 1px solid #e1e7ef; border-radius: 7px; background: #f3f6fa; display: inline-flex; }
  .toggle button { padding: 4px 7px; border: 0; border-radius: 5px; color: #68788e; background: transparent; font-size: 10px; }
  .toggle button.on { color: #1e5ca6; background: #fff; box-shadow: 0 1px 3px #253a561f; font-weight: 700; }
  .preview-stage { position: relative; border: 1px solid #e5ebf2; border-radius: 8px; overflow: hidden; background: linear-gradient(145deg, #fbfcfe, #f3f6fa); }
  #preview { width: 100%; height: 205px; display: block; }
  .preview-foot { min-height: 25px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; }
  #previewStatus { color: #62738a; font-size: 10px; }
  #previewCount { color: #76859a; font-size: 10px; }
  .presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .preset { min-height: 58px; padding: 8px; text-align: left; border: 1px solid #e1e7ef; border-radius: 8px; background: #fff; color: #263852; }
  .preset:hover { border-color: #9bbde8; background: #f9fbff; }
  .preset.selected { border-color: #4b8bdb; box-shadow: 0 0 0 1px #4b8bdb inset; background: #f2f7ff; }
  .preset strong { display: block; margin-bottom: 3px; font-size: 11px; }
  .preset span { display: block; color: #77869a; font-size: 10px; line-height: 1.3; }
  .preset-actions { display: flex; justify-content: flex-end; margin-top: 7px; }
  .text-btn { padding: 3px 0; border: 0; color: #3573bd; background: transparent; font-size: 10px; }
  .row { display: flex; align-items: center; gap: 8px; min-height: 28px; margin: 6px 0; }
  .row > label, .row > .label { flex: 0 0 108px; color: #42536a; font-size: 11px; line-height: 1.25; }
  .row label small, .row .label small { display: block; margin-top: 2px; color: #8a97a8; font-size: 9px; }
  .ctl { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
  input[type=text], input[type=number], select { width: 100%; min-width: 0; height: 29px; padding: 0 8px; border: 1px solid #d7dee8; border-radius: 6px; background: #fff; color: #25354b; }
  input[type=number] { text-align: right; }
  select { padding-right: 4px; }
  input:focus, select:focus, button:focus { outline: 2px solid #a8cdf8; outline-offset: 1px; }
  input[readonly] { color: #68788d; background: #f4f6f9; }
  .unit { flex: 0 0 auto; color: #8996a8; font-size: 10px; }
  .seg { display: inline-flex; width: 100%; padding: 2px; border: 1px solid #e3e8ef; border-radius: 7px; background: #f3f6f9; }
  .seg button { flex: 1; min-width: 0; padding: 5px 3px; border: 0; border-radius: 5px; color: #64748a; background: transparent; font-size: 10px; }
  .seg button.on { color: #245f9e; background: white; box-shadow: 0 1px 3px #1b345022; font-weight: 700; }
  .dimensions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .dimension { min-width: 0; padding: 7px; border-radius: 7px; background: #f5f7fa; }
  .dimension label { display: block; margin-bottom: 4px; color: #7c899a; font-size: 9px; }
  .dimension input { text-align: right; }
  .hint-box { margin-top: 7px; color: #718096; font-size: 10px; line-height: 1.4; }
  .error { display: none; margin: 0 0 8px; padding: 8px 10px; border: 1px solid #f2c5c5; border-radius: 7px; color: #a82d2d; background: #fff1f1; line-height: 1.4; }
  .footer { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 9px 12px; border-top: 1px solid #e1e7ef; background: #fff; }
  .btn { min-height: 31px; padding: 0 13px; border: 1px solid transparent; border-radius: 7px; font-weight: 700; }
  .btn.ghost { color: #53647a; background: #f2f5f8; border-color: #e6eaf0; }
  .btn.primary { color: #fff; background: #286fc3; box-shadow: 0 2px 4px #286fc333; }
  .btn.primary:hover { background: #205fa9; }
  .btn:disabled { opacity: .58; cursor: wait; }
  [hidden] { display: none !important; }
  .section-note { margin: 4px 0 2px; padding: 6px 8px; border-radius: 6px; background: #f3f7fc; color: #52647c; font-size: 10px; line-height: 1.4; }
  .row .help { display: block; margin-top: 2px; color: #8a97a8; font-size: 9px; }
  .footer { flex-direction: column; align-items: stretch; gap: 6px; }
  .footer-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .error-bar { display: none; padding: 7px 10px; border: 1px solid #f2c5c5; border-radius: 7px; color: #a82d2d; background: #fff1f1; font-size: 11px; line-height: 1.35; max-height: 84px; overflow-y: auto; word-break: break-word; }
  .busy-hint { display: none; padding: 5px 9px; border-radius: 7px; color: #7a5a14; background: #fff8e6; border: 1px solid #f0dca6; font-size: 10px; }
  .dc-info { color: #52647c; font-size: 10px; line-height: 1.4; }
  @media (max-width: 390px) {
    .rail { flex-basis: 34px; }
    .topbar { padding-left: 9px; padding-right: 9px; }
    .content { padding-left: 8px; padding-right: 8px; }
    .row > label, .row > .label { flex-basis: 96px; }
    .card-body { padding-left: 8px; padding-right: 8px; }
    #preview { height: 185px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Drawer Maker Pro">
    <div class="brand" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 2.5h12v11H2zM2 6h12M2 9.5h12M6 3.8h4M6 7.4h4M6 11h4"/></svg></div>
    <div class="rail-mark"></div><div class="rail-label">WORKSHOP</div>
  </nav>
  <main class="main">
    <header class="topbar">
      <div class="title-wrap"><div class="eyebrow">Drawer Maker Pro · Workshop</div><div class="title" id="mainTitle">Drawer</div></div>
      <span class="mode-pill" id="modeBadge">Mode baru</span>
      <span class="space-pill" id="spaceLabel">—</span>
    </header>
    <div class="content" id="content">
      <p class="intro" id="introText">Atur konstruksi, ukuran, dan detail laci. Pratinjau menampilkan geometri parametrik.</p>
      <div class="error" id="error" role="alert"></div>

      <section class="card" id="previewCard">
        <button class="card-head" type="button" aria-expanded="true"><span class="chevron">⌄</span><span class="card-title">Pratinjau rakitan</span><span class="card-hint" id="previewHint">Menunggu geometri</span></button>
        <div class="card-body">
          <div class="preview-tools"><span class="preview-title">Tampilan komponen aktual</span><div class="toggle" role="group" aria-label="Sudut pratinjau"><button type="button" data-view="front" class="on" aria-pressed="true">Depan</button><button type="button" data-view="iso" aria-pressed="false">Isometrik</button></div></div>
          <div class="preview-stage"><svg id="preview" role="img" aria-label="Pratinjau geometri kabinet atau laci"></svg></div>
          <div class="preview-foot"><span id="previewStatus" aria-live="polite">Memuat ukuran komponen…</span><span id="previewCount"></span></div>
        </div>
      </section>

      <section class="card" id="presetCard">
        <button class="card-head" type="button" aria-expanded="true"><span class="chevron">⌄</span><span class="card-title">Pilih inspirasi</span><span class="card-hint">Template lokal · bisa disesuaikan</span></button>
        <div class="card-body"><div class="presets" id="presets"></div><div class="preset-actions"><button class="text-btn" id="resetPreset" type="button">Pulihkan preset</button></div></div>
      </section>

      <section class="card" id="spaceCard">
        <button class="card-head" type="button" aria-expanded="true"><span class="chevron">⌄</span><span class="card-title">Dimensi ruang</span><span class="card-hint" id="spaceHint">mm</span></button>
        <div class="card-body" id="spaceFields"></div>
      </section>

      <div id="sections"></div>
    </div>
    <footer class="footer">
      <div class="error-bar" id="errorBar" role="alert"></div>
      <div class="busy-hint" id="busyHint" role="status"></div>
      <div class="dc-info" id="dcInfo">Pintu &amp; laci dibuat sebagai Dynamic Component: gunakan Interact Tool (ikon tangan) untuk membuka/menutup.</div>
      <div class="footer-actions"><button class="btn ghost" id="cancel" type="button">Batal</button><button class="btn primary" id="create" type="button">Buat rakitan</button></div>
    </footer>
  </main>
</div>
