<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Drawer Maker Pro</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px "Segoe UI", -apple-system, Arial, sans-serif; color: #1f2937; background: #f3f5f9; }
  .app { display: flex; min-height: 100vh; }
  .rail { width: 44px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 10px; }
  .rail .ico { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: #6b7280; }
  .rail .ico.active { background: #2563eb; color: #fff; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px; }
  header .kind { font-size: 10px; letter-spacing: .08em; color: #6b7280; font-weight: 600; }
  header .tab { background: #e0e7ff; color: #1d4ed8; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
  header .space { margin-left: auto; font-size: 11px; color: #047857; background: #d1fae5; padding: 2px 6px; border-radius: 6px; }
  .content { padding: 0 10px 80px; overflow: auto; flex: 1; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin: 8px 0; }
  .card > h3 { margin: 0; padding: 9px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .card > h3 .hint { margin-left: auto; color: #6b7280; font-weight: 400; }
  .card > h3::before { content: "\25BE"; color: #6b7280; }
  .card.closed > h3::before { content: "\25B8"; }
  .card.closed .body { display: none; }
  .body { padding: 2px 10px 8px; border-top: 1px solid #f0f1f4; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; min-height: 26px; }
  .row label { flex: 0 0 120px; color: #374151; }
  .row label small { display: block; color: #9ca3af; font-size: 10px; }
  .row .ctl { flex: 1; display: flex; gap: 6px; align-items: center; min-width: 0; }
  input[type=text], input[type=number], select { width: 100%; height: 26px; border: 1px solid #d1d5db; border-radius: 6px; padding: 0 8px; font: inherit; background: #fff; text-align: center; }
  select { text-align: left; }
  input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px #bfdbfe; }
  .seg { display: inline-flex; background: #f3f4f6; border-radius: 7px; padding: 2px; width: 100%; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 4px 6px; border-radius: 5px; font: inherit; cursor: pointer; color: #374151; }
  .seg button.on { background: #fff; color: #1d4ed8; font-weight: 600; box-shadow: 0 0 0 1px #93c5fd; }
  .unit { color: #9ca3af; font-size: 10px; }
  #preview { width: 100%; height: 170px; display: block; }
  .info { color: #6b7280; font-size: 11px; margin: 4px 0 0; }
  .error { display: none; margin: 8px 0; padding: 8px 10px; border-radius: 6px; background: #fee2e2; color: #b91c1c; }
  footer { position: fixed; bottom: 0; left: 44px; right: 0; padding: 10px 12px; background: #fff; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 8px; }
  .btn { border: 0; border-radius: 6px; padding: 7px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.primary { background: #2563eb; color: #fff; }
  .btn.ghost { background: #f3f4f6; color: #374151; }
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="ico active" title="Drawer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5"/><path d="M1.5 6h13M1.5 10.5h13M6.5 3.8h3M6.5 8.2h3M6.5 12.6h3"/></svg>
    </div>
  </nav>
  <div class="main">
    <header>
      <span class="kind">DRAWER</span><span class="tab">Basic Settings</span>
      <span class="space" id="spaceLabel">-</span>
    </header>
    <div class="content">
      <div class="error" id="error"></div>

      <section class="card">
        <h3>Preview <span class="hint" id="previewHint"></span></h3>
        <div class="body"><svg id="preview"></svg></div>
      </section>

      <section class="card">
        <h3>Insert Face <span class="hint">Front</span></h3>
        <div class="body">
          <div class="row"><label>Front Mode</label>
            <div class="ctl"><div class="seg" data-field="front_mode">
              <button data-v="inset">Inset</button><button data-v="overlay">Overlay</button>
            </div></div></div>
          <div class="row" id="overlayRow"><label>Overlay<small>past the opening</small></label>
            <div class="ctl"><input type="number" data-field="overlay" step="0.5"><span class="unit">mm</span></div></div>
        </div>
      </section>

      <section class="card">
        <h3>Drawer / Accessories</h3>
        <div class="body">
          <div class="row"><label>Name</label><div class="ctl"><input type="text" data-field="name"></div></div>
          <div class="row"><label>Handle</label>
            <div class="ctl"><select data-field="handle">
              <option value="bar">Bar handle</option>
              <option value="gola">Handle-free (Gola gap)</option>
              <option value="none">None</option>
            </select></div></div>
          <div class="row" data-show="bar"><label>Handle Length</label>
            <div class="ctl"><input type="number" data-field="handle_length"><span class="unit">mm</span></div></div>
          <div class="row" data-show="gola"><label>Gola Gap<small>above each front</small></label>
            <div class="ctl"><input type="number" data-field="gola_gap"><span class="unit">mm</span></div></div>
        </div>
      </section>

      <section class="card">
        <h3>Size Parameters</h3>
        <div class="body">
          <div class="row"><label>Layout Mode</label>
            <div class="ctl"><div class="seg" data-field="layout">
              <button data-v="vertical">Vertical</button><button data-v="horizontal">Horizontal</button>
            </div></div></div>
          <div class="row"><label>Quantity<small>3 &middot; 1:1:2 &middot; 200:1:1</small></label>
            <div class="ctl"><input type="text" data-field="quantity"></div></div>
          <div class="row"><label>Drawer Depth<small>0 = auto</small></label>
            <div class="ctl"><input type="number" data-field="drawer_depth"><span class="unit">mm</span></div></div>
          <div class="row"><label>Board Thickness</label>
            <div class="ctl"><input type="number" data-field="board_thickness" step="0.5"><span class="unit">mm</span></div></div>
          <div class="row"><label>Front Thickness</label>
            <div class="ctl"><input type="number" data-field="front_thickness" step="0.5"><span class="unit">mm</span></div></div>
          <div class="row"><label>Gap / Clearance</label>
            <div class="ctl"><input type="number" data-field="gap" step="0.5"><span class="unit">mm</span></div></div>
          <div class="row"><label>Bottom Thick. / Raise</label>
            <div class="ctl"><input type="number" data-field="bottom_thickness" step="0.5"><input type="number" data-field="bottom_raise" step="0.5"></div></div>
        </div>
      </section>

      <section class="card closed">
        <h3>Slide &amp; Box Clearances</h3>
        <div class="body">
          <div class="row"><label>Slide Clearance<small>per side</small></label>
            <div class="ctl"><input type="number" data-field="slide_clearance" step="0.5"><span class="unit">mm</span></div></div>
          <div class="row"><label>Top / Bottom</label>
            <div class="ctl"><input type="number" data-field="top_clearance"><input type="number" data-field="bottom_clearance"></div></div>
          <div class="row"><label>Back Clearance</label>
            <div class="ctl"><input type="number" data-field="back_clearance"><span class="unit">mm</span></div></div>
          <div class="row"><label>Box Height<small>0 = auto</small></label>
            <div class="ctl"><input type="number" data-field="box_height"><span class="unit">mm</span></div></div>
        </div>
      </section>
    </div>
    <footer>
      <button class="btn ghost" id="cancel">Cancel</button>
      <button class="btn primary" id="create">Create</button>
    </footer>
  </div>
</div>

<script>
var DMP = (function () {
  var state = { mode: 'create', space: { width: 600, depth: 550, height: 720 }, params: {} };
  var FIXED = 20;

  function $(s) { return document.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }

  function call(name, arg) {
    if (window.sketchup && window.sketchup[name]) { arg === undefined ? sketchup[name]() : sketchup[name](arg); }
    else { console.log('[sketchup.' + name + ']', arg); }
  }

  // Same rules as Calculator.split_lengths (Ruby).
  function split(spec, total) {
    var t = String(spec).split(/[:,\s]+/).filter(Boolean);
    if (!t.length) throw 'Quantity is empty';
    if (t.length === 1 && /^\d+$/.test(t[0]) && +t[0] <= FIXED) {
      var n = +t[0]; if (n < 1) throw 'Quantity must be at least 1';
      return Array.apply(null, Array(n)).map(function () { return total / n; });
    }
    var v = t.map(function (x) { if (!/^\d+(\.\d+)?$/.test(x)) throw 'Invalid quantity value: ' + x; return +x; });
    var fixed = 0, w = 0;
    v.forEach(function (x) { if (x > FIXED) fixed += x; else w += x; });
    var rem = total - fixed;
    if (rem < 0 || (w === 0 && Math.abs(rem) > 0.5)) throw 'Fixed sizes do not fit the space';
    return v.map(function (x) { return x > FIXED ? x : rem * x / w; });
  }

  function read() {
    $$('[data-field]').forEach(function (el) {
      var f = el.getAttribute('data-field');
      if (el.classList.contains('seg')) return;
      state.params[f] = el.type === 'number' ? parseFloat(el.value || '0') : el.value;
    });
    return state.params;
  }

  function write() {
    $$('[data-field]').forEach(function (el) {
      var f = el.getAttribute('data-field'), v = state.params[f];
      if (el.classList.contains('seg')) {
        $$('[data-field="' + f + '"] button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); });
      } else if (v !== undefined) { el.value = v; }
    });
  }

  function refresh() {
    var p = read(), s = state.space;
    $('#overlayRow').style.display = p.front_mode === 'overlay' ? '' : 'none';
    $$('[data-show]').forEach(function (r) { r.style.display = r.getAttribute('data-show') === p.handle ? '' : 'none'; });
    $('#spaceLabel').textContent = [s.width, s.height, s.depth].map(function (x) { return Math.round(x * 10) / 10; }).join(' \u00d7 ');
    $('#create').textContent = state.mode === 'edit' ? 'Apply' : 'Create';
    drawPreview(p, s);
  }

  function drawPreview(p, s) {
    // Draw in mm and let the viewBox scale/center it.
    var svg = $('#preview'), k = 1, pad = Math.max(s.width, s.height) * 0.06;
    var ox = pad, oy = s.height + pad, fs = Math.max(s.width, s.height) * 0.06;
    svg.setAttribute('viewBox', [0, 0, s.width + 2 * pad, s.height + 2 * pad].join(' '));
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    var out = '<style>#preview rect{vector-effect:non-scaling-stroke}</style>' +
              '<rect x="' + ox + '" y="' + (oy - s.height * k) + '" width="' + s.width * k + '" height="' + s.height * k +
              '" fill="#eef2ff" stroke="#6b7280" stroke-dasharray="4 3"/>';
    var vertical = p.layout !== 'horizontal', lens;
    try { lens = split(p.quantity, vertical ? s.height : s.width); hideError(); }
    catch (e) { showError(e); svg.innerHTML = out; $('#previewHint').textContent = ''; return; }
    var off = 0, g = p.gap || 0, ov = p.front_mode === 'overlay' ? (p.overlay || 0) : 0;
    var order = vertical ? lens.slice().reverse() : lens;
    order.forEach(function (len) {
      var x = vertical ? 0 : off, z = vertical ? off : 0, w = vertical ? s.width : len, h = vertical ? len : s.height;
      var fx = x - ov + g / 2, fz = z - ov + g / 2, fw = w + 2 * ov - g, fh = h + 2 * ov - g;
      if (p.handle === 'gola') fh -= p.gola_gap || 0;
      out += '<rect x="' + (ox + fx * k) + '" y="' + (oy - (fz + fh) * k) + '" width="' + Math.max(fw * k, 0) + '" height="' + Math.max(fh * k, 0) +
             '" rx="' + fs * 0.15 + '" fill="#3b6fe8" stroke="#1e3a8a"/>';
      if (p.handle === 'bar') {
        var hl = Math.min(p.handle_length || 0, fw - 40), hz = fz + fh - Math.min(40, fh / 2);
        out += '<rect x="' + (ox + (fx + (fw - hl) / 2) * k) + '" y="' + (oy - (hz + 6) * k) + '" width="' + Math.max(hl * k, 0) + '" height="12" fill="#111827"/>';
      }
      out += '<text x="' + (ox + (fx + fw / 2) * k) + '" y="' + (oy - (fz + fh / 2) * k + fs * 0.35) + '" fill="#fff" font-size="' + fs + '" text-anchor="middle">' + Math.round(len * 10) / 10 + '</text>';
      off += len;
    });
    svg.innerHTML = out;
    $('#previewHint').textContent = lens.length + ' drawer' + (lens.length > 1 ? 's' : '');
  }

  function showError(msg) { var e = $('#error'); e.textContent = msg; e.style.display = 'block'; }
  function hideError() { $('#error').style.display = 'none'; }

  document.addEventListener('DOMContentLoaded', function () {
    $$('.card > h3').forEach(function (h) { h.addEventListener('click', function () { h.parentNode.classList.toggle('closed'); }); });
    $$('.seg').forEach(function (seg) {
      seg.addEventListener('click', function (e) {
        var v = e.target.getAttribute('data-v'); if (!v) return;
        state.params[seg.getAttribute('data-field')] = v; write(); refresh();
      });
    });
    $$('input, select').forEach(function (el) { el.addEventListener('input', refresh); });
    $('#create').addEventListener('click', function () { call('create', JSON.stringify(read())); });
    $('#cancel').addEventListener('click', function () { call('cancel'); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') $('#create').click();
      if (e.key === 'Escape') call('cancel');
    });
    call('ready');
  });

  return {
    load: function (s) { state = s; write(); refresh(); },
    error: showError
  };
})();
</script>
</body>
</html>
